name: Fix bare global declarations

on:
  push:
    paths:
      - '.github/workflows/fix-bare-globals.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix semantic module declarations
        shell: python
        run: |
          from pathlib import Path

          fixes = {
              "src/HUD.lua": ["TargetTracerDrawing"],
              "src/Camera.lua": ["SpectateChoice", "SpectateToggle", "FreecamCF"],
              "src/Player.lua": ["FlyVelocity", "FlyGyro", "FlyRoot", "GhostModel", "GhostRoot", "GhostHumanoid"],
              "src/Target.lua": ["TargetMainChoice", "BookmarkChoice"],
              "src/World.lua": ["GunESPObject", "CachedDroppedGun", "CachedNearestCoin"],
          }

          for filename, names in fixes.items():
              path = Path(filename)
              lines = path.read_text(encoding="utf-8").splitlines()
              found = set()

              for i, line in enumerate(lines):
                  stripped = line.strip()
                  if stripped in names:
                      lines[i] = stripped + " = nil"
                      found.add(stripped)

              missing = set(names) - found
              if missing:
                  raise RuntimeError(f"{filename}: declarations not found: {sorted(missing)}")

              path.write_text("\n".join(lines) + "\n", encoding="utf-8")

      - name: Commit fix and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-bare-globals.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore semantic module global declarations"
          git push
