name: Restructure semantic modules

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restructure:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build semantic modules
        run: python tools/restructure.py
      - name: Commit semantic layout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "refactor: semantic feature modules"
            git push
          fi
